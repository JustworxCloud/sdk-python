[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "justworx-sdk"
version = "0.1.0"
description = "Official Python SDK for the Justworx API (/api/v2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Justworx" }]
keywords = ["justworx", "iot", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://justworx.com"
Repository = "https://github.com/JustworxCloud/sdk-python"
"API reference" = "https://github.com/JustworxCloud/OpenAPI"

[tool.hatch.build.targets.wheel]
packages = ["src/justworx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
